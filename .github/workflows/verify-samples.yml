name: サンプルのテスト

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.sample }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sample:
          - spring/form-validation/01-validation-basics
          - spring/form-validation/02-controller-service
          - spring/form-validation/03-thymeleaf-redisplay
          - spring/form-validation/04-mockmvc-security
          - spring/book-selection-check
          - testing/mockito-order-lab
    steps:
      - name: ソースを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Java 17を用意
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: 環境を表示
        run: |
          java -version
          mvn --version
      - name: 独立したサンプルのテストを実行
        working-directory: ${{ matrix.sample }}
        run: mvn --batch-mode --no-transfer-progress test
