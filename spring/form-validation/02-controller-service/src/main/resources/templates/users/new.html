<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>登録</title></head>
<body>
<form th:action="@{/users}" th:object="${form}" method="post">
  <label>名前<input th:field="*{name}"></label>
  <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
  <label>メール<input th:field="*{email}"></label>
  <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
  <label>部署コード<input th:field="*{departmentCode}"></label>
  <button type="submit">登録</button>
</form>
</body>
</html>
