<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>社員登録サンプル</title></head>
<body>
<form th:action="@{/employees}" th:object="${employeeForm}" method="post">
    <label for="name">氏名</label>
    <input id="name" type="text" th:field="*{name}">
    <p th:errors="*{name}"></p>

    <label for="departmentCode">部署</label>
    <select id="departmentCode" th:field="*{departmentCode}">
        <option value="">選択してください</option>
        <option th:each="department : ${departments}"
                th:value="${department.code}" th:text="${department.name}"></option>
    </select>
    <p th:errors="*{departmentCode}"></p>

    <label for="email">メールアドレス</label>
    <input id="email" type="email" th:field="*{email}">
    <p id="email-error" th:errors="*{email}"></p>
    <button type="submit">登録</button>
</form>
</body>
</html>
